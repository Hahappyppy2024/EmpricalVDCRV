<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Localis AI</title><link rel="stylesheet" href="/styles.css"></head><body><aside><div class="brand">LOCALIS <span>AI</span></div><button id="newChat">＋ New conversation</button><nav><button data-view="chat">Chat</button><button data-view="knowledge">Knowledge</button><button data-view="templates">Templates</button><button data-view="settings">Model settings</button><button data-view="admin">Administration</button></nav><small>Deterministic offline assistant</small></aside><main><header><strong id="identity">Public visitor</strong><button data-view="account">Account</button></header><section id="chat" class="view"><h1>Ask with context.</h1><div class="chatbox"><div id="messages"></div><form id="prompt"><textarea name="content" placeholder="Ask the local assistant…" required></textarea><button>Send</button></form></div></section><section id="knowledge" class="view hidden"><h2>Knowledge collections</h2><button id="loadCollections">Load collections</button><pre id="knowledgeOut"></pre></section><section id="templates" class="view hidden"><h2>Prompt templates</h2><button id="loadTemplates">Load templates</button><pre id="templatesOut"></pre></section><section id="settings" class="view hidden"><h2>Model settings</h2><button id="loadModels">Available models</button><button id="loadSettings">My settings</button><pre id="settingsOut"></pre></section><section id="admin" class="view hidden"><h2>Administration</h2><button id="moderation">Moderation queue</button><button id="audit">Audit events</button><pre id="adminOut"></pre></section><section id="account" class="view hidden"><h2>Account</h2><form id="login"><input name="email" type="email" value="user@example.test"><input name="password" type="password" value="Password123!"><button>Sign in</button></form><button id="logout">Sign out</button><pre id="accountOut"></pre></section></main><script src="/app.js"></script></body></html>
