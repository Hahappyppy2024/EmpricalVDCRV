<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar CMS</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><span class="eyebrow">P05 CONTENT PLATFORM</span><h1>Northstar CMS</h1></div><div id="session">Public visitor</div></header><nav><button data-view="public">Public site</button><button data-view="account">Account</button><button data-view="studio">Content studio</button><button data-view="admin">Administration</button></nav><main><section id="public" class="view"><h2>Published stories</h2><div class="filters"><input id="tag" placeholder="Filter by tag"><button id="browse">Browse</button></div><div id="stories" class="cards"></div></section><section id="account" class="view hidden"><h2>Account access</h2><form id="login"><input name="email" type="email" value="author@example.test" required><input name="password" type="password" value="Password123!" required><button>Sign in</button></form><button id="logout">Sign out</button><pre id="accountOut"></pre></section><section id="studio" class="view hidden"><h2>Content studio</h2><form id="create"><select name="type"><option>post</option><option>page</option></select><input name="title" placeholder="Title" required><input name="slug" placeholder="slug" required><button>Create draft</button></form><div class="toolbar"><button id="loadContent">Load content #1</button><button id="loadMedia">Media library</button><button id="loadTemplates">Templates</button></div><pre id="studioOut"></pre></section><section id="admin" class="view hidden"><h2>Administration</h2><div class="toolbar"><button data-admin="users">Users</button><button data-admin="settings">Settings</button><button data-admin="integrations">Integrations</button><button data-admin="redirects">Redirects</button></div><pre id="adminOut"></pre></section></main><footer>Offline demo · SQLite persistence · Role-aware workflows</footer><script src="/app.js"></script></body></html>
