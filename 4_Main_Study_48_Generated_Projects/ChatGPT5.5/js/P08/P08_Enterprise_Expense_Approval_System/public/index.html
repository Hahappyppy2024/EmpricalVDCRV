<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LedgerFlow Expenses</title><link rel="stylesheet" href="/styles.css"></head><body><aside><div class="mark">LF</div><h1>LedgerFlow</h1><p>Expense approval</p><nav><button data-view="login">Account</button><button data-view="dashboard">Dashboard</button><button data-view="reports">Reports</button><button data-view="queue">Approval queue</button><button data-view="admin">Configuration</button></nav></aside><main><header><span>ENTERPRISE OPERATIONS</span><strong id="identity">Signed out</strong></header><section id="login" class="view"><h2>Account access</h2><form id="loginForm"><input name="email" value="employee@example.test" type="email" required><input name="password" value="Password123!" type="password" required><button>Sign in</button></form><button id="logout">Sign out</button><pre id="loginOut"></pre></section><section id="dashboard" class="view hidden"><h2>Dashboard</h2><button id="refreshDashboard">Refresh</button><pre id="dashboardOut"></pre></section><section id="reports" class="view hidden"><h2>Expense reports</h2><form id="createReport"><input name="title" placeholder="Report title" required><select name="currency"><option>USD</option><option>CAD</option></select><input name="business_purpose" placeholder="Business purpose"><button>Create draft</button></form><button id="listReports">List my reports</button><pre id="reportsOut"></pre></section><section id="queue" class="view hidden"><h2>Role queue</h2><button id="managerQueue">Manager pending</button><button id="financeQueue">Finance approved</button><pre id="queueOut"></pre></section><section id="admin" class="view hidden"><h2>Configuration</h2><button id="departments">Departments</button><button id="policies">Expense policies</button><pre id="adminOut"></pre></section></main><script src="/app.js"></script></body></html>
