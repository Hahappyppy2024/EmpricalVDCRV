services:
  conference:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_PATH: var/conference.sqlite
      SESSION_COOKIE: conf_session
      SESSION_TTL_SECONDS: "86400"
      PASSWORD_RESET_TTL_SECONDS: "1800"
      UPLOAD_DIR: var/manuscripts
      MAX_UPLOAD_BYTES: "10485760"
    volumes: ["conference-data:/app/var"]
volumes:
  conference-data:
