services:
  lms:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_PATH: var/lms.sqlite
      SESSION_COOKIE: lms_session
      SESSION_TTL_SECONDS: "86400"
      PASSWORD_RESET_TTL_SECONDS: "1800"
      UPLOAD_DIR: var/uploads
      MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - lms-data:/app/var
volumes:
  lms-data:
