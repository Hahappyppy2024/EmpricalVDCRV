<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teamline Chat</title><link rel="stylesheet" href="/assets/styles.css"></head><body>
<header><div><span class="mark">T</span><strong>Teamline</strong></div><span id="connection">offline</span></header>
<main><section class="login" id="login"><h1>Your team, in one place.</h1><p>Deterministic local chat for channels, direct messages, presence and moderation.</p><form id="login-form"><label>Email<input id="email" value="alice@example.test"></label><label>Password<input id="password" type="password" value="Password123!"></label><button>Sign in</button></form><small>Admin: admin@example.test</small></section>
<section class="shell hidden" id="shell"><aside><h2>Research Team</h2><nav id="channels"></nav><button id="logout" class="quiet">Log out</button></aside><section class="chat"><div class="chat-head"><div><h2 id="channel-name"># general</h2><p>Local workspace channel</p></div><button id="presence">Set away</button></div><div id="messages"></div><form id="composer"><input id="message" placeholder="Message #general" maxlength="4000"><button>Send</button></form></section><aside class="people"><h3>Workspace</h3><div id="members"><span class="dot online"></span>Alice<br><span class="dot away"></span>Bob<br><span class="dot online"></span>Admin</div><h3>Quick search</h3><form id="search-form"><input id="search" placeholder="Search messages"><button>Search</button></form><div id="results"></div></aside></section></main><script src="/assets/app.js"></script></body></html>
