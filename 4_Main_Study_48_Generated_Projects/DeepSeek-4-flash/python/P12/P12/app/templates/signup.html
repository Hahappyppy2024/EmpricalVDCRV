{% extends "base.html" %}
{% block title %}Register — P12 Data Analytics Dashboard{% endblock %}
{% block page %}signup{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Register</h1>
  <p class="muted">New accounts are created with the <code>viewer</code> role.</p>
  <form method="post" action="{{ url_for('pages.signup') }}">
    <label>Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <button type="submit" class="btn primary">Register and sign in</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('pages.login') }}">Sign in</a>.</p>
</div>
{% endblock %}
