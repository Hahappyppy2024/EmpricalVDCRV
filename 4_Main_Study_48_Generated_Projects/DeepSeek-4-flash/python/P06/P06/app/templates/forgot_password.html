{% extends "base.html" %}
{% block title %}Recover account · Team Chat{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Recover your account</h1>
    <p class="muted">Enter your email address and we will send a reset link. The mail adapter is local and writes to <code>instance/mailbox</code>.</p>
    <form method="post" action="{{ url_for('accounts.forgot_password_page') }}" class="stack">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>
    <div class="auth-links">
      <a href="{{ url_for('accounts.login_page') }}">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
