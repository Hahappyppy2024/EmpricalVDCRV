{% extends "base.html" %}
{% block title %}Reset password · Team Chat{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Reset your password</h1>
    <form method="post" action="{{ url_for('accounts.reset_password_page', token=token) }}" class="stack">
      <label>New password
        <input type="password" name="new_password" required minlength="8">
      </label>
      <button class="btn btn-primary" type="submit">Reset password</button>
    </form>
  </div>
</div>
{% endblock %}
