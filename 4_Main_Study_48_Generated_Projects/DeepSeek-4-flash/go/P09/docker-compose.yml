services:
  issuetracker:
    build: .
    container_name: p09-issuetracker
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /app/data/issuetracker.db
      UPLOAD_DIR: /app/data/uploads
      SESSION_SECRET: compose-session-secret
      SESSION_TTL_HOURS: "24"
      MAX_UPLOAD_MB: "5"
      APP_URL: http://localhost:8080
    volumes:
      - issuetracker-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  issuetracker-data:
