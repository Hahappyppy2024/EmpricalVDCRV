<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P05 Content Studio</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">P05 Content Studio <small>· CMS</small></a>
      <nav class="site-nav">
        <span id="nav-menus"></span>
        <form class="search-form" action="/search" method="get">
          <input type="search" name="q" placeholder="Search articles..." aria-label="Search">
          <button class="btn btn-sm" type="submit">Search</button>
        </form>
        <a class="btn btn-sm btn-ghost" href="/login">Sign in</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container-narrow">
      <h1 id="hero-title">P05 Content Studio</h1>
      <p id="hero-tagline">A synthetic content management system</p>
    </div>
  </section>

  <main class="page">
    <div class="container">
      <div id="categories"></div>
      <h2 id="listing-title">Latest articles</h2>
      <div id="article-grid" class="article-grid"></div>
    </div>
  </main>

  <footer style="padding: 24px 0; color: var(--muted); text-align: center; font-size: 0.85rem;">
    P05 Content Management System · synthetic benchmark project
  </footer>

  <script type="module" src="/js/public.js"></script>
</body>
</html>
