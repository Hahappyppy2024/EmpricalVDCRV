<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · P05 CMS</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">P05 Content Studio</div>
      <nav id="side-nav"></nav>
      <div class="side-user">
        <strong id="side-user-name">…</strong>
        <span id="side-user-role"></span>
        <div style="margin-top:8px; display:flex; gap:8px;">
          <a class="btn btn-sm btn-ghost" href="/">Public site</a>
          <button class="btn btn-sm btn-danger" id="logout-btn">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="app-main">
      <div class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="actions" id="page-actions"></div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
