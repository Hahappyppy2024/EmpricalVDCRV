<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · P05 Content Studio</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">P05 Content Studio <small>· CMS</small></a>
      <nav class="site-nav">
        <a href="/">Home</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="form-card">
      <h1 id="auth-title">Sign in</h1>
      <p class="sub" id="auth-sub">Access the content management dashboard.</p>
      <div id="auth-errors"></div>

      <form id="auth-form">
        <div class="field">
          <label for="identifier">Username or email</label>
          <input id="identifier" name="identifier" autocomplete="username" required>
        </div>
        <div class="field" id="email-field" style="display:none;">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
        </div>
        <div class="field" id="username-field" style="display:none;">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field" id="display-field" style="display:none;">
          <label for="displayName">Display name <span class="hint">(optional)</span></label>
          <input id="displayName" name="displayName">
        </div>
        <button class="btn" type="submit" style="width:100%;" id="auth-submit">Sign in</button>
      </form>

      <div class="auth-footer">
        <span id="auth-switch-text">No account?</span>
        <a href="#" id="auth-switch">Create one</a>
      </div>

      <div class="demo-accounts">
        <strong>Seed accounts</strong>
        <table>
          <tr><td>admin / admin123</td><td>(administrator)</td></tr>
          <tr><td>editor / editor123</td><td>(editor)</td></tr>
          <tr><td>author / author123</td><td>(author)</td></tr>
          <tr><td>moderator / moderator123</td><td>(moderator)</td></tr>
          <tr><td>visitor / visitor123</td><td>(visitor)</td></tr>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
