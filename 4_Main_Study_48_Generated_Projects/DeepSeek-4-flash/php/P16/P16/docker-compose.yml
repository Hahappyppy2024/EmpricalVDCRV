services:
  p16-monitor:
    build: .
    container_name: p16-monitor
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_URL: http://127.0.0.1:8080
      APP_ENV: development
      APP_SECRET: p16-local-dev-secret-change-me
      DB_PATH: storage/monitoring.sqlite
      SESSION_NAME: p16_session
      SESSION_LIFETIME: "7200"
      WS_ENABLED: "0"
      WS_URL: ws://127.0.0.1:9090
      WS_PORT: "9090"
      BACKUP_DIR: storage/backups
      UPLOAD_DIR: storage/uploads
      LOG_DIR: storage/logs
    volumes:
      - p16-data:/app/storage
    restart: unless-stopped

volumes:
  p16-data:
