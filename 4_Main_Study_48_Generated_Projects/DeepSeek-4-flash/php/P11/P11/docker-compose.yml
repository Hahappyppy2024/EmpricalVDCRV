services:
  app:
    build: .
    container_name: hosting-control-panel
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      DB_PATH: /app/data/hosting.db
      STORAGE_DIR: /app/storage
      APP_URL: http://localhost:8080
      WS_PORT: 8081
    volumes:
      - hosting_data:/app/data
      - hosting_storage:/app/storage
    command: >
      sh -c "php bin/seed.php &&
             (php bin/websocket.php &) &&
             php -S 0.0.0.0:8080 -t /app/public /app/public/router.php"

volumes:
  hosting_data:
  hosting_storage:
