services:
  app:
    build: .
    command: ["serve"]
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/public/uploads
    environment:
      - DB_PATH=data/shop.db
      - APP_URL=http://localhost:8080
      - WS_URL=ws://localhost:8081
      - WS_HOST=0.0.0.0
      - WS_PORT=8081
      - UPLOAD_DIR=public/uploads
      - LOG_FILE=storage/logs/error.log

  ws:
    build: .
    command: ["ws"]
    ports:
      - "8081:8081"
    depends_on:
      - app
    volumes:
      - sqlite_data:/app/data
    environment:
      - DB_PATH=data/shop.db
      - WS_HOST=0.0.0.0
      - WS_PORT=8081

volumes:
  sqlite_data:
  uploads_data:
