# netd local development configuration
# Strict key=value format: no unknown/duplicate keys, malformed or
# out-of-range values are startup errors. Lines starting with '#' and
# blank lines are ignored.

# IPv4 address the TCP listener binds to.
bind_address = 127.0.0.1

# TCP port for the newline-delimited application protocol.
port = 9090

# SQLite database (WAL mode, schema version 1).
database_path = data/netd.db

# Structured line-oriented audit/event log.
log_path = logs/netd.log

# PID file (fcntl-locked; stale files are recovered).
pid_file = run/netd.pid

# Bounded pthread worker pool size.
worker_count = 4

# Connection and command limits.
max_clients = 64
max_command_bytes = 4096
idle_timeout_seconds = 60
auth_timeout_seconds = 10

# Graceful shutdown deadline.
shutdown_timeout_seconds = 5

# Expiry maintenance.
expiry_scan_interval_seconds = 10
expiry_batch_size = 100

# SQLite busy timeout for concurrent writers.
database_busy_timeout_ms = 5000

# Bounded listing limit.
list_max_limit = 100

# Strict audit: fail startup if the log is not writable.
strict_audit = 0

# Log flush policy: auto (fflush each line) or always (fsync each line).
log_flush = auto
