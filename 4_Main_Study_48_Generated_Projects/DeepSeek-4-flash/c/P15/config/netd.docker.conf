# netd container configuration (used by Docker Compose).
# The listener is exposed on all interfaces so the host can reach it via
# the published port; SQLite/log/PID data live in mounted writable volumes.
bind_address = 0.0.0.0
port = 9090
database_path = /data/netd.db
log_path = /logs/netd.log
pid_file = /run/netd.pid
worker_count = 4
max_clients = 64
max_command_bytes = 4096
idle_timeout_seconds = 60
auth_timeout_seconds = 10
shutdown_timeout_seconds = 5
expiry_scan_interval_seconds = 10
expiry_batch_size = 100
database_busy_timeout_ms = 5000
list_max_limit = 100
strict_audit = 0
log_flush = auto
