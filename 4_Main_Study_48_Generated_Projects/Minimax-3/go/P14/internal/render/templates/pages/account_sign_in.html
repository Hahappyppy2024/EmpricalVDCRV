{{define "content"}}
<section class="card">
  <h1>Sign in</h1>
  {{if .error}}<div class="alert error">{{.error}}</div>{{end}}
  {{if .notice}}<div class="alert ok">{{.notice}}</div>{{end}}
  <form method="post" action="/account_access/sign_in" class="form">
    <label>Email <input name="email" type="email" required value="{{.email}}"></label>
    <label>Password <input name="password" type="password" required></label>
    <div class="row">
      <button class="btn primary" type="submit">Sign in</button>
      <a class="btn" href="/account_access/register">Need an account?</a>
    </div>
  </form>
  <details class="hint">
    <summary>Seed accounts</summary>
    <ul>
      <li>admin@p14.local / admin123 (admin)</li>
      <li>alice@p14.local / user123 (user)</li>
    </ul>
  </details>
</section>
{{end}}
