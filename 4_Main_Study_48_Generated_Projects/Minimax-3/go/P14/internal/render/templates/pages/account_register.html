{{define "content"}}
<section class="card">
  <h1>Create account</h1>
  {{if .error}}<div class="alert error">{{.error}}</div>{{end}}
  <form method="post" action="/account_access/register" class="form">
    <label>Display name <input name="display_name" type="text" required value="{{.display_name}}"></label>
    <label>Email <input name="email" type="email" required value="{{.email}}"></label>
    <label>Password <input name="password" type="password" required minlength="6"></label>
    <div class="row">
      <button class="btn primary" type="submit">Register</button>
      <a class="btn" href="/account_access/sign_in">Already have one?</a>
    </div>
  </form>
</section>
{{end}}
