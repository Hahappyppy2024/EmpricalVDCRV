services:
  p14:
    build:
      context: .
      dockerfile: Dockerfile
    image: p14-workflow-automation:latest
    container_name: p14-workflow-automation
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - p14-data:/app/data
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /app/data/app.db
      WORKSPACE_ROOT: /app/data/workspaces
      UPLOAD_ROOT: /app/data/uploads
      SESSION_SECRET: "${SESSION_SECRET:-p14-dev-secret-change-me}"
      P14_ALLOW_SHELL: "false"

volumes:
  p14-data: