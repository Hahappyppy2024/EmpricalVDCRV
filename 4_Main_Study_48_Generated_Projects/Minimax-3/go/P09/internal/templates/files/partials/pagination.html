{{ define "partials/pagination.html" }}
{{ if gt .TotalPages 1 }}
<nav class="pagination">
  {{ if gt .Page 1 }}<a href="?page={{ sub .Page 1 }}{{ if .Query }}&q={{ .Query }}{{ end }}" class="btn btn-sm">&laquo; Prev</a>{{ end }}
  <span class="muted">Page {{ .Page }} of {{ .TotalPages }} &middot; {{ .TotalItems }} items</span>
  {{ if lt .Page .TotalPages }}<a href="?page={{ add .Page 1 }}{{ if .Query }}&q={{ .Query }}{{ end }}" class="btn btn-sm">Next &raquo;</a>{{ end }}
</nav>
{{ end }}
{{ end }}
