services:
  chat:
    build: .
    image: p06-real-time-team-chat:latest
    container_name: p06-real-time-team-chat
    environment:
      FLASK_SECRET_KEY: docker-dev-secret-key
      FLASK_DEBUG: "0"
      DATABASE_URL: sqlite:////app/data/chat.db
      STORAGE_DIR: /app/storage
      HOST: 0.0.0.0
      PORT: "5000"
      SESSION_LIFETIME: "604800"
    ports:
      - "5000:5000"
    volumes:
      - chat-data:/app/data
      - chat-storage:/app/storage
    restart: unless-stopped

volumes:
  chat-data:
  chat-storage:
