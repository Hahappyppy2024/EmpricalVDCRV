{% extends "base.html" %}
{% block title %}Upload dataset{% endblock %}
{% block content %}
<section class="page-header">
  <h1>Upload a dataset</h1>
  <p class="muted">CSV or JSON files up to 25 MiB. Schema is detected automatically.</p>
</section>
<form id="upload-form" class="form-stack card" enctype="multipart/form-data" action="/api/data/dataset_upload" method="post">
  <label>Dataset name<input name="name" required maxlength="128"></label>
  <label>Description<textarea name="description" rows="3" placeholder="What does this dataset represent?"></textarea></label>
  <label>Visibility
    <select name="visibility">
      <option value="private">Private (only me)</option>
      <option value="team" selected>Team (signed-in users)</option>
      <option value="public">Public (link accessible)</option>
    </select>
  </label>
  <label>Tags<input name="tags" placeholder="comma,separated,tags"></label>
  <label>File<input name="file" type="file" accept=".csv,.json" required></label>
  <button type="submit" class="btn btn-primary">Upload</button>
  <p class="form-status" data-role="status"></p>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/dataset_upload.js') }}" defer></script>
{% endblock %}
