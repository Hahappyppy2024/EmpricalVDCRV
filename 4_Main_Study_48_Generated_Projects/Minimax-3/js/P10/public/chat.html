<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat — AI Assistant / LLM WebUI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="grid" style="grid-template-columns: 260px 1fr;">
      <section class="card">
        <h3>Conversations</h3>
        <div id="conv-list"></div>
        <button id="new-conv">New conversation</button>
      </section>
      <section class="card">
        <div class="flex" style="justify-content: space-between;">
          <h3 id="conv-title">Chat playground</h3>
          <span class="muted mono" id="conv-meta"></span>
        </div>
        <div id="thread" class="chat-thread"></div>
        <form id="prompt-form">
          <label>Prompt
            <textarea name="prompt" required minlength="1" maxlength="16000"
              placeholder="Ask anything..."></textarea>
          </label>
          <div class="flex" style="justify-content: space-between;">
            <label class="flex gap-sm">
              <input type="checkbox" id="use-stream" checked /> WebSocket streaming
            </label>
            <button type="submit" id="send-btn">Send</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <footer>Local deterministic model · SQLite session storage · Express 5</footer>
  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { mountNav } from '/js/nav.js';
    const user = await mountNav();
    const { api, el, flash } = AI;
    let activeConvId = null;
    let abortController = null;

    async function refreshConversations() {
      const { items } = await api('GET', '/api/ai/conversation_management');
      const host = document.getElementById('conv-list');
      host.innerHTML = '';
      items.forEach(conv => {
        const row = el('div', { className: 'list-row' },
          el('a', { href: '#', onClick: (e) => { e.preventDefault(); openConv(conv.id); } },
            conv.title),
          el('span', { className: 'badge ' + (conv.status === 'archived' ? 'warn' : 'accent') },
            conv.status)
        );
        host.appendChild(row);
      });
      if (!activeConvId && items.length > 0) await openConv(items[0].id);
      else if (activeConvId) await openConv(activeConvId, false);
    }

    async function openConv(id, reloadMessages = true) {
      activeConvId = id;
      const data = await api('GET', '/api/ai/conversations/' + id);
      document.getElementById('conv-title').textContent = data.title;
      document.getElementById('conv-meta').textContent =
        `model=${data.model_id} · T=${data.temperature} · ctx=${data.context_length}`;
      if (!reloadMessages) return;
      const thread = document.getElementById('thread');
      thread.innerHTML = '';
      for (const msg of data.messages) {
        appendBubble(msg.role, msg.content, msg.citations ? JSON.parse(msg.citations) : []);
      }
      thread.scrollTop = thread.scrollHeight;
    }

    function appendBubble(role, content, citations) {
      const thread = document.getElementById('thread');
      const bubble = el('div', { className: 'bubble ' + role }, content);
      if (citations && citations.length) {
        const cite = el('div', { className: 'citation' },
          'Citations: ' + citations.map(c => c.ref || c.kind).join(', '));
        bubble.appendChild(cite);
      }
      thread.appendChild(bubble);
      thread.scrollTop = thread.scrollHeight;
      return bubble;
    }

    document.getElementById('new-conv').addEventListener('click', async () => {
      const title = prompt('Conversation title?', 'New chat');
      if (!title) return;
      try {
        const conv = await api('POST', '/api/ai/conversation_management', { title });
        activeConvId = conv.id;
        await refreshConversations();
      } catch (err) {
        flash('Could not create conversation: ' + err.message, 'error');
      }
    });

    document.getElementById('prompt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeConvId) { flash('Open or create a conversation first', 'error'); return; }
      const prompt = e.currentTarget.prompt.value.trim();
      if (!prompt) return;
      const useStream = document.getElementById('use-stream').checked;
      const thread = document.getElementById('thread');
      appendBubble('user', prompt);
      e.currentTarget.prompt.value = '';

      if (useStream) {
        runWebSocket(prompt);
      } else {
        try {
          const result = await api('POST', '/api/ai/chat_execution', {
            conversation_id: activeConvId, prompt
          });
          appendBubble('assistant', result.response, result.citations);
        } catch (err) {
          flash('Chat failed: ' + err.message, 'error');
        }
      }
    });

    function runWebSocket(prompt) {
      const thread = document.getElementById('thread');
      const placeholder = appendBubble('assistant', '');
      const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${window.location.host}/ws/chat`);
      ws.onopen = () => {
        ws.send(JSON.stringify({ conversation_id: activeConvId, prompt }));
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.event === 'error') {
          placeholder.textContent = 'Error: ' + msg.message;
          flash('Stream error: ' + msg.message, 'error');
          return;
        }
        if (msg.event === 'token') {
          placeholder.textContent += msg.delta;
          thread.scrollTop = thread.scrollHeight;
        } else if (msg.event === 'done') {
          if (msg.citations && msg.citations.length) {
            const cite = el('div', { className: 'citation' },
              'Citations: ' + msg.citations.map(c => c.ref || c.kind).join(', '));
            placeholder.appendChild(cite);
          }
        }
      };
      ws.onclose = () => { /* connection closed */ };
    }

    await refreshConversations();
  </script>
</body>
</html>
