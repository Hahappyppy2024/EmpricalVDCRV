<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin — AI Assistant / LLM WebUI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card">
      <h2>System settings</h2>
      <form id="new-setting" class="flex">
        <input type="text" name="key" required placeholder="Setting key" />
        <input type="text" name="value" required placeholder="Value" />
        <button type="submit">Save</button>
      </form>
      <table id="settings-table">
        <thead><tr><th>Key</th><th>Value</th><th>Updated</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h3>Blocked terms</h3>
      <form id="new-block" class="flex">
        <input type="text" name="term" required placeholder="Term" />
        <select name="severity">
          <option value="warn">warn</option>
          <option value="block">block</option>
        </select>
        <button type="submit">Add term</button>
      </form>
      <table id="block-table">
        <thead><tr><th>Term</th><th>Severity</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h3>Users</h3>
      <table id="user-table">
        <thead><tr><th>Email</th><th>Display name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h3>Recent moderation history</h3>
      <table id="mod-table">
        <thead><tr><th>Time</th><th>User</th><th>Decision</th><th>Reason</th><th>Actor</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <footer>Local deterministic model · SQLite session storage · Express 5</footer>
  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { mountNav } from '/js/nav.js';
    await mountNav();
    const { api, el, flash } = AI;

    async function refresh() {
      const { settings, blocked_terms: blocked, moderation, users } =
        await api('GET', '/api/ai/admin_moderation_and_settings');
      const setBody = document.querySelector('#settings-table tbody');
      setBody.innerHTML = '';
      settings.forEach(s => setBody.appendChild(el('tr', {},
        el('td', { className: 'mono' }, s.key),
        el('td', { className: 'mono' }, s.value),
        el('td', { className: 'mono' }, new Date(s.updated_at).toLocaleString())
      )));
      const blockBody = document.querySelector('#block-table tbody');
      blockBody.innerHTML = '';
      blocked.forEach(b => blockBody.appendChild(el('tr', {},
        el('td', { className: 'mono' }, b.term),
        el('td', {}, el('span', { className: 'badge ' + (b.severity === 'block' ? 'danger' : 'warn') }, b.severity)),
        el('td', {},
          el('button', { className: 'danger', onClick: async () => {
            try { await api('DELETE', `/api/ai/admin/blocked_terms/${b.id}`); await refresh(); }
            catch (err) { flash(err.message, 'error'); }
          } }, 'Remove')
        )
      )));
      const userBody = document.querySelector('#user-table tbody');
      userBody.innerHTML = '';
      users.forEach(u => userBody.appendChild(el('tr', {},
        el('td', { className: 'mono' }, u.email),
        el('td', {}, u.display_name),
        el('td', {}, el('span', { className: 'badge ' + (u.role === 'admin' ? 'accent' : '') }, u.role)),
        el('td', {}, el('span', { className: 'badge ' +
          (u.status === 'active' ? 'success' : u.status === 'suspended' ? 'warn' : 'danger') }, u.status)),
        el('td', {},
          el('button', { className: 'secondary', onClick: () => moderate(u, 'suspend') }, 'Suspend'),
          el('button', { className: 'secondary', onClick: () => moderate(u, 'disable') }, 'Disable'),
          el('button', { className: 'secondary', onClick: () => moderate(u, 'reinstate') }, 'Reinstate')
        )
      )));
      const modBody = document.querySelector('#mod-table tbody');
      modBody.innerHTML = '';
      moderation.forEach(m => modBody.appendChild(el('tr', {},
        el('td', { className: 'mono' }, new Date(m.created_at).toLocaleString()),
        el('td', {}, m.user_email || m.user_id),
        el('td', {}, m.decision),
        el('td', { className: 'muted' }, m.reason),
        el('td', { className: 'muted' }, m.actor_id)
      )));
    }
    async function moderate(user, decision) {
      const reason = prompt(`Reason for ${decision}?`);
      if (!reason) return;
      try {
        await api('POST', '/api/ai/admin/moderation',
          { user_id: user.id, decision, reason });
        flash(`Decision ${decision} recorded`, 'success');
        await refresh();
      } catch (err) { flash(err.message, 'error'); }
    }
    document.getElementById('new-setting').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.currentTarget));
      try { await api('POST', '/api/ai/admin/settings', data); e.currentTarget.reset(); await refresh(); }
      catch (err) { flash(err.message, 'error'); }
    });
    document.getElementById('new-block').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.currentTarget));
      try { await api('POST', '/api/ai/admin/blocked_terms', data); e.currentTarget.reset(); await refresh(); }
      catch (err) { flash(err.message, 'error'); }
    });
    await refresh();
  </script>
</body>
</html>
