# netd.conf — example configuration for the lightweight network daemon.
#
# Strict key=value parser. Lines starting with '#' are comments. Unknown keys,
# duplicate keys, malformed values, and out-of-range values are startup errors.

# IPv4 bind address (default 127.0.0.1)
bind_address=127.0.0.1

# TCP listener port (default 9090)
port=9090

# SQLite database file (default ./var/netd.db)
database_path=./var/netd.db

# Structured log file (default ./var/netd.log)
log_path=./var/netd.log

# Audit log file (default ./var/netd.audit.log)
audit_log_path=./var/netd.audit.log

# PID file path (default ./var/netd.pid)
pid_file=./var/netd.pid

# Bounded pthread worker pool size (1..256, default 4)
worker_count=4

# Idle timeout in seconds before unauthenticated connections are closed (1..86400)
idle_timeout_seconds=60

# Maximum concurrent client connections (1..8192)
max_clients=64

# Maximum command line bytes per connection (64..1048576)
max_command_bytes=65536

# Expiry worker scan interval in seconds (1..3600)
expiry_scan_interval_seconds=10

# Expiry worker batch size (1..100000)
expiry_batch_size=100

# Graceful shutdown timeout in seconds (1..600)
shutdown_timeout_seconds=10

# Strict audit mode refuses startup if audit log cannot be opened (true|false)
strict_audit=true

# SQLite busy timeout in milliseconds (0..60000)
database_busy_timeout_ms=2000